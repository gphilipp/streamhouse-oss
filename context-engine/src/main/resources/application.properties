quarkus.application.name=context-engine
quarkus.http.port=8082
quarkus.http.test-port=0

# Serving store (Postgres). Tables live in the "serving" schema, one per enabled topic.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${STREAMHOUSE_DB_USER:streamhouse}
quarkus.datasource.password=${STREAMHOUSE_DB_PASSWORD:streamhouse}
quarkus.datasource.jdbc.url=${STREAMHOUSE_DB_URL:jdbc:postgresql://localhost:5432/streamhouse}?reWriteBatchedInserts=true
quarkus.datasource.jdbc.max-size=32
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=serving
quarkus.flyway.locations=db/serving
quarkus.flyway.table=_flyway_history

# Kafka and schema registry (Confluent-compatible API, e.g. Apicurio ccompat)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
quarkus.kafka.devservices.enabled=false
quarkus.kafka.health.enabled=true
streamhouse.context.registry-url=${SCHEMA_REGISTRY_URL:http://localhost:8085/apis/ccompat/v7}

# Security: OIDC bearer tokens from Keycloak
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/streamhouse}
quarkus.oidc.token.issuer=${OIDC_ISSUER:http://localhost:8180/realms/streamhouse}
quarkus.oidc.application-type=service
quarkus.keycloak.devservices.enabled=false
quarkus.http.auth.permission.authenticated.paths=/v1/*,/admin/*,/mcp,/mcp/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# MCP (streamable HTTP at /mcp)
quarkus.mcp.server.server-info.name=streamhouse-context-engine
quarkus.mcp.server.server-info.version=${quarkus.application.version}
quarkus.mcp.server.http.dns-rebinding-check.enabled=false
quarkus.http.cors.enabled=true

quarkus.micrometer.export.prometheus.path=/q/metrics

%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.log.category."org.apache.kafka".level=WARN
