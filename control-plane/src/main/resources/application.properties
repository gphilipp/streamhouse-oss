quarkus.application.name=control-plane
quarkus.http.port=8080
quarkus.http.test-port=0

# Desired state lives in the "streamhouse_meta" schema of the platform database.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${STREAMHOUSE_DB_USER:streamhouse}
quarkus.datasource.password=${STREAMHOUSE_DB_PASSWORD:streamhouse}
quarkus.datasource.jdbc.url=${STREAMHOUSE_DB_URL:jdbc:postgresql://localhost:5432/streamhouse}
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=streamhouse_meta
quarkus.flyway.locations=db/meta
quarkus.flyway.table=_flyway_history

# How the control plane reaches each component (host ports when run outside compose).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
quarkus.kafka.devservices.enabled=false
streamhouse.registry-url=${SCHEMA_REGISTRY_URL:http://localhost:8085/apis/ccompat/v7}
streamhouse.connect-url=${CONNECT_URL:http://localhost:8083}
streamhouse.flink.gateway-url=${FLINK_GATEWAY_URL:http://localhost:8084}
streamhouse.flink.jobmanager-url=${FLINK_JOBMANAGER_URL:http://localhost:8081}
streamhouse.gravitino-url=${GRAVITINO_URL:http://localhost:8090}
streamhouse.context-engine-url=${CONTEXT_ENGINE_URL:http://localhost:8082}

# How components reach each other inside the platform network (rendered into connector and Flink configs).
streamhouse.internal.kafka-bootstrap=${INTERNAL_KAFKA_BOOTSTRAP:kafka:9092}
streamhouse.internal.registry-url=${INTERNAL_REGISTRY_URL:http://apicurio:8080/apis/ccompat/v7}
streamhouse.internal.apicurio-url=${INTERNAL_APICURIO_URL:http://apicurio:8080/apis/registry/v3}
streamhouse.internal.iceberg-rest-url=${INTERNAL_ICEBERG_REST_URL:http://gravitino:9001/iceberg/}
streamhouse.internal.s3-endpoint=${INTERNAL_S3_ENDPOINT:http://s3:8333}
streamhouse.internal.s3-access-key=${S3_ACCESS_KEY:streamhouse}
streamhouse.internal.s3-secret-key=${S3_SECRET_KEY:streamhouse-secret}

# Security: users and agents authenticate with Keycloak; the control plane calls the context engine as "control-plane".
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/streamhouse}
quarkus.oidc.token.issuer=${OIDC_ISSUER:http://localhost:8180/realms/streamhouse}
quarkus.oidc.application-type=service
quarkus.keycloak.devservices.enabled=false
quarkus.http.auth.permission.authenticated.paths=/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.client-id=${CONTROL_PLANE_CLIENT_ID:control-plane}
quarkus.oidc-client.credentials.secret=${CONTROL_PLANE_CLIENT_SECRET:control-plane-secret}
quarkus.oidc-client.grant.type=client

%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc-client.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.log.category."org.apache.kafka".level=WARN
