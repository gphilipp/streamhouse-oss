[project]
name = "shop-assistant"
version = "0.1.0"
description = "A streamhouse demo that runs unchanged on Streamhouse OSS and on Confluent Cloud."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "anthropic[mcp]>=0.70",
    "mcp>=1.12",
    "httpx2>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
shop-assistant = "shop_assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
