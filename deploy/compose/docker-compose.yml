# Streamhouse OSS — local stack.
# See CONVENTIONS.md for addresses, ports and credentials, README.md for usage.
name: streamhouse

x-flink-env: &flink-env
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    rest.address: jobmanager
    rest.bind-address: 0.0.0.0
    taskmanager.numberOfTaskSlots: 8
    parallelism.default: 1
    jobmanager.memory.process.size: 1280m
    taskmanager.memory.process.size: 3072m
    state.backend.type: hashmap
    execution.checkpointing.interval: 10s
    execution.checkpointing.dir: s3://warehouse/_flink/checkpoints
    execution.checkpointing.savepoint-dir: s3://warehouse/_flink/savepoints
    s3.endpoint: http://s3:8333
    s3.path.style.access: true
    s3.access-key: streamhouse
    s3.secret-key: streamhouse-secret
    table.exec.source.idle-timeout: 5s

services:
  # ---------------------------------------------------------------- transport
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 15s

  apicurio:
    image: apicurio/apicurio-registry:3.3.3
    hostname: apicurio
    ports:
      - "8085:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://platform-db:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: streamhouse
      APICURIO_DATASOURCE_PASSWORD: streamhouse
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT-VERSION_ENABLED: "true"
      APICURIO_REST_DELETION_GROUP_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    depends_on:
      platform-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/registry/v3/system/info > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  # ---------------------------------------------------------------- capture
  shop-db:
    image: postgres:17
    hostname: shop-db
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - shop-db-data:/var/lib/postgresql/data
      - ../../examples/ecommerce/shop-schema.sql:/docker-entrypoint-initdb.d/01-shop-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    hostname: connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: streamhouse-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      ADVERTISED_HOST_NAME: connect
      ENABLE_APICURIO_CONVERTERS: "true"
      HEAP_OPTS: -Xms256m -Xmx1g
    depends_on:
      kafka:
        condition: service_healthy
      apicurio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # ---------------------------------------------------------------- storage
  s3:
    image: chrislusf/seaweedfs:4.48
    hostname: s3
    command: ["server", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  s3-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "s3.bucket.list" | weed shell -master=s3:9333 | grep -q '^  warehouse' \
          || echo "s3.bucket.create -name warehouse" | weed shell -master=s3:9333
        echo "s3.bucket.list" | weed shell -master=s3:9333
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- transform
  jobmanager:
    build: ./flink
    image: streamhouse/flink:2.1.3
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      <<: *flink-env
    depends_on:
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  taskmanager:
    image: streamhouse/flink:2.1.3
    hostname: taskmanager
    command: taskmanager
    environment:
      <<: *flink-env
    depends_on:
      jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://jobmanager:8081/taskmanagers | grep -q '\"id\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  sql-gateway:
    image: streamhouse/flink:2.1.3
    hostname: sql-gateway
    command:
      - /opt/flink/bin/sql-gateway.sh
      - start-foreground
      - -Dsql-gateway.endpoint.rest.address=0.0.0.0
      - -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
      - -Dsql-gateway.endpoint.rest.port=8083
      - -Dsql-gateway.session.idle-timeout=30min
    ports:
      - "8084:8083"
    environment:
      <<: *flink-env
    depends_on:
      jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/v3/info > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  # ---------------------------------------------------------------- govern
  gravitino:
    image: apache/gravitino:1.3.1
    hostname: gravitino
    ports:
      - "8090:8090"
      - "9001:9001"
    environment:
      SKIP_CONFIG_REWRITE: "true"
      GRAVITINO_MEM: -Xms512m -Xmx1g
    volumes:
      - ./gravitino/gravitino.conf:/opt/gravitino/conf/gravitino.conf:ro
    depends_on:
      platform-db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/api/version > /dev/null && curl -fsS http://localhost:9001/iceberg/v1/config > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s

  keycloak:
    image: keycloak/keycloak:26.8.0
    hostname: keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8180"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/streamhouse-realm.json:/opt/keycloak/data/import/streamhouse-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s

  # ---------------------------------------------------------------- platform metadata + serving
  platform-db:
    image: postgres:17
    hostname: platform-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: streamhouse
      POSTGRES_USER: streamhouse
      POSTGRES_PASSWORD: streamhouse
    volumes:
      - platform-db-data:/var/lib/postgresql/data
      - ./platform-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhouse -d streamhouse"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- streamhouse services (profile: apps)
  context-engine:
    profiles: ["apps"]
    build:
      context: ../../context-engine
      dockerfile: src/main/docker/Dockerfile.jvm
    image: streamhouse/context-engine:dev
    hostname: context-engine
    ports:
      - "8082:8082"
    environment:
      STREAMHOUSE_DB_URL: jdbc:postgresql://platform-db:5432/streamhouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/ccompat/v7
      OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/streamhouse
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/q/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      platform-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      apicurio:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  control-plane:
    profiles: ["apps"]
    build:
      context: ../../control-plane
      dockerfile: src/main/docker/Dockerfile.jvm
    image: streamhouse/control-plane:dev
    hostname: control-plane
    ports:
      - "8080:8080"
    environment:
      STREAMHOUSE_DB_URL: jdbc:postgresql://platform-db:5432/streamhouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/ccompat/v7
      CONNECT_URL: http://connect:8083
      FLINK_GATEWAY_URL: http://sql-gateway:8083
      FLINK_JOBMANAGER_URL: http://jobmanager:8081
      GRAVITINO_URL: http://gravitino:8090
      CONTEXT_ENGINE_URL: http://context-engine:8082
      OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/streamhouse
      # Secrets referenced as SECRET '<name>' in CREATE CONNECTION statements.
      STREAMHOUSE_SECRET_SHOP_PG_PWD: debezium
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      platform-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy
      sql-gateway:
        condition: service_healthy
      gravitino:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      context-engine:
        condition: service_healthy

volumes:
  kafka-data:
  shop-db-data:
  platform-db-data:
  s3-data:
