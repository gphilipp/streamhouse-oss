# Iceberg tables, through the Gravitino Iceberg REST catalog. Registered in every SQL Gateway session.
type: iceberg
catalog-type: rest
uri: http://gravitino:9001/iceberg/
io-impl: org.apache.iceberg.aws.s3.S3FileIO
s3.endpoint: http://s3:8333
s3.path-style-access: "true"
s3.access-key-id: streamhouse
s3.secret-access-key: streamhouse-secret
client.region: us-east-1
