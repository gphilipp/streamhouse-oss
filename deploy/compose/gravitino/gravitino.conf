# Gravitino server for the local streamhouse stack: only settings that differ from the defaults.
# Mounted over conf/gravitino.conf with SKIP_CONFIG_REWRITE=true.

# Metadata store: PostgreSQL (database `gravitino` on platform-db, schema created by its init script)
gravitino.entity.store = relational
gravitino.entity.store.relational = JDBCBackend
gravitino.entity.store.relational.jdbcUrl = jdbc:postgresql://platform-db:5432/gravitino
gravitino.entity.store.relational.jdbcDriver = org.postgresql.Driver
gravitino.entity.store.relational.jdbcUser = streamhouse
gravitino.entity.store.relational.jdbcPassword = streamhouse

gravitino.authorization.enable = false

# Iceberg REST catalog (auxiliary service on :9001), JDBC backend on platform-db, data on SeaweedFS S3
gravitino.auxService.names = iceberg-rest
gravitino.iceberg-rest.classpath = iceberg-rest-server/libs, iceberg-rest-server/conf
gravitino.iceberg-rest.host = 0.0.0.0
gravitino.iceberg-rest.httpPort = 9001
gravitino.iceberg-rest.catalog-backend = jdbc
gravitino.iceberg-rest.catalog-backend-name = lake
gravitino.iceberg-rest.uri = jdbc:postgresql://platform-db:5432/iceberg
gravitino.iceberg-rest.jdbc-driver = org.postgresql.Driver
gravitino.iceberg-rest.jdbc-user = streamhouse
gravitino.iceberg-rest.jdbc-password = streamhouse
gravitino.iceberg-rest.jdbc-initialize = true
gravitino.iceberg-rest.warehouse = s3://warehouse/
gravitino.iceberg-rest.io-impl = org.apache.iceberg.aws.s3.S3FileIO
gravitino.iceberg-rest.s3-endpoint = http://s3:8333
gravitino.iceberg-rest.s3-region = us-east-1
gravitino.iceberg-rest.s3-access-key-id = streamhouse
gravitino.iceberg-rest.s3-secret-access-key = streamhouse-secret
gravitino.iceberg-rest.s3-path-style-access = true
